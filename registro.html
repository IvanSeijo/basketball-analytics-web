<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Basketball Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f4f4; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
  .header {
    background: #fff; border-bottom: 1px solid #e8e8e8;
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 20px; font-weight: 700; text-decoration: none; color: #1a1a1a; }
  .logo .b { color: #1a7a4a; }

  .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .box {
    background: #fff; border: 1px solid #e8e8e8; border-radius: 16px;
    padding: 36px; width: 100%; max-width: 420px;
  }
  .tabs { display: flex; border-bottom: 1px solid #e8e8e8; margin-bottom: 28px; }
  .tab {
    flex: 1; padding: 10px; font-size: 14px; font-weight: 600;
    text-align: center; cursor: pointer; color: #aaa; border-bottom: 2px solid transparent;
    transition: all 0.15s; background: none; border-left: none; border-right: none; border-top: none;
    font-family: inherit;
  }
  .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

  .form { display: none; }
  .form.active { display: block; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: 500; }
  .field input {
    width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 8px; outline: none; color: #1a1a1a;
  }
  .field input:focus { border-color: #1a7a4a; }

  .btn-submit {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 600; font-family: inherit;
    background: #1a1a1a; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; transition: background 0.15s; margin-top: 8px;
  }
  .btn-submit:hover { background: #333; }
  .error { font-size: 13px; color: #c0392b; margin-top: 10px; display: none; }
  .success { font-size: 13px; color: #1a7a4a; margin-top: 10px; display: none; }
</style>
</head>
<body>
<header class="header">
  <a href="index.html" class="logo"><span class="b">B</span>A Basketball Analytics</a>
</header>

<div class="page">
  <div class="box">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Login -->
    <div class="form active" id="form-login">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="tu@email.com"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="login-pass" placeholder="••••••••"></div>
      <button class="btn-submit" onclick="doLogin()">Entrar</button>
      <div class="error" id="login-error"></div>
    </div>

    <!-- Registro -->
    <div class="form" id="form-register">
      <div class="field"><label>Nombre de usuario *</label><input type="text" id="reg-username" placeholder="ej: analista_basket"></div>
      <div class="field"><label>Nombre real (opcional)</label><input type="text" id="reg-fullname" placeholder="ej: Juan García"></div>
      <div class="field"><label>Email *</label><input type="email" id="reg-email" placeholder="tu@email.com"></div>
      <div class="field"><label>Contraseña *</label><input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn-submit" onclick="doRegister()">Crear cuenta</button>
      <div class="error" id="reg-error"></div>
      <div class="success" id="reg-success"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mnccorcmggxncjkcsxwq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uY2NvcmNtZ2d4bmNqa2NzeHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NjUyOTEsImV4cCI6MjA5NzA0MTI5MX0.kndtQGiTO_Z3Ob0Rha0AVpUjHjKgDxGmE9GRRgAmiAM';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('form-' + tab).classList.add('active');
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = 'Email o contraseña incorrectos'; errEl.style.display = 'block'; }
  else window.location.href = 'comunidad.html';
}

async function doRegister() {
  const username = document.getElementById('reg-username').value.trim();
  const fullname = document.getElementById('reg-fullname').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const errEl = document.getElementById('reg-error');
  const sucEl = document.getElementById('reg-success');
  errEl.style.display = 'none'; sucEl.style.display = 'none';

  if (!username) { errEl.textContent = 'El nombre de usuario es obligatorio'; errEl.style.display = 'block'; return; }

  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }

  if (data.user) {
    await sb.from('profiles').insert([{
      id: data.user.id, username, full_name: fullname, role: 'user'
    }]);
    sucEl.textContent = 'Cuenta creada. Revisa tu email para confirmar (o entra directamente si tienes la confirmación desactivada).';
    sucEl.style.display = 'block';
    setTimeout(() => window.location.href = 'comunidad.html', 2000);
  }
}

// Si ya está logueado, redirigir
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'comunidad.html';
});
</script>
</body>
</html>
