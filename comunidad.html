<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunidad - Basketball Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f4f4; color: #1a1a1a; }

  .header {
    background: #fff; border-bottom: 1px solid #e8e8e8;
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 10px;
  }
  .logo { font-size: 20px; font-weight: 700; text-decoration: none; color: #1a1a1a; }
  .logo .b { color: #1a7a4a; }
  .nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .nav a {
    padding: 7px 14px; font-size: 13px; border: 1px solid #e0e0e0;
    border-radius: 8px; text-decoration: none; color: #555; transition: all 0.15s;
  }
  .nav a:hover { background: #f5f5f5; }
  .nav a.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .nav-btn {
    padding: 7px 14px; font-size: 13px; border: 1px solid #1a7a4a;
    border-radius: 8px; text-decoration: none; color: #1a7a4a;
    background: #fff; cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .nav-btn:hover { background: #e8fdf0; }
  .nav-btn.filled { background: #1a7a4a; color: #fff; }
  .nav-btn.filled:hover { background: #155f3a; }

  .page { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }

  .page-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .page-top h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }

  .filters {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px; font-size: 12px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 999px; background: #fff;
    cursor: pointer; color: #555; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: #aaa; }
  .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .search-bar {
    position: relative; margin-bottom: 24px;
  }
  .search-bar input {
    width: 100%; padding: 10px 16px 10px 38px; font-size: 14px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 10px; background: #fff; outline: none;
  }
  .search-bar input:focus { border-color: #aaa; }
  .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; }

  .posts { display: flex; flex-direction: column; gap: 14px; }

  .post-card {
    background: #fff; border: 1px solid #e8e8e8; border-radius: 14px;
    padding: 22px; transition: box-shadow 0.15s;
  }
  .post-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }

  .post-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #555; flex-shrink: 0;
    overflow: hidden; text-decoration: none;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .post-meta { flex: 1; }
  .post-author {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: #1a1a1a;
    text-decoration: none; margin-bottom: 3px;
  }
  .post-author:hover { text-decoration: underline; }
  .stars-badge { display: flex; gap: 2px; }
  .star { font-size: 13px; }
  .post-date { font-size: 12px; color: #aaa; }

  .post-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 500;
    background: #f0f0f0; color: #666;
  }
  .tag.league { background: #e8fdf0; color: #1a7a4a; }
  .tag.team { background: #e8f0fd; color: #1a4d9c; }

  .post-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.2px; }
  .post-content {
    font-size: 14px; color: #555; line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 14px;
  }

  .post-media { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .media-badge {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    background: #f5f5f5; color: #666; display: flex; align-items: center; gap: 5px;
  }

  .post-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px solid #f0f0f0; flex-wrap: wrap; gap: 10px;
  }
  .rating-area { display: flex; align-items: center; gap: 8px; }
  .rating-stars { display: flex; gap: 3px; }
  .rating-star {
    font-size: 22px; cursor: pointer; color: #ddd; transition: color 0.1s; line-height: 1;
    background: none; border: none; padding: 0;
  }
  .rating-star:hover, .rating-star.hover, .rating-star.selected { color: #f5a623; }
  .rating-count { font-size: 12px; color: #aaa; }
  .rating-avg { font-size: 14px; font-weight: 600; color: #1a1a1a; }

  .read-more {
    font-size: 13px; color: #1a7a4a; font-weight: 600;
    text-decoration: none; cursor: pointer; background: none; border: none; font-family: inherit;
  }
  .read-more:hover { text-decoration: underline; }

  .empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px; }
  .loading { text-align: center; padding: 40px; color: #aaa; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #e8e8e8; border-top-color: #1a7a4a;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal post completo */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 32px;
    width: 100%; max-width: 680px; position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    font-size: 20px; background: none; border: none; cursor: pointer; color: #aaa;
  }
  .modal-close:hover { color: #1a1a1a; }
  .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  .modal-content { font-size: 15px; color: #444; line-height: 1.8; margin-bottom: 20px; }
  .modal-video { width: 100%; aspect-ratio: 16/9; border-radius: 10px; border: none; margin-bottom: 20px; }
  .modal-court { width: 100%; border-radius: 10px; border: 1px solid #e8e8e8; margin-bottom: 20px; }

  @media (max-width: 600px) {
    .header, .page { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo"><span class="b">B</span>A Basketball Analytics</a>
  <nav class="nav">
    <a href="diccionario.html">Diccionario</a>
    <a href="pizarra-tactica.html">Pizarra</a>
    <a href="prediccion-menu.html">Predicción</a>
    <a href="comunidad.html" class="active">Comunidad</a>
    <a href="sobre.html">¿Quiénes somos?</a>
    <div id="auth-area" style="display:flex;gap:6px;"></div>
  </nav>
</header>

<div class="page">
  <div class="page-top">
    <h1>Comunidad</h1>
    <a href="nuevo-post.html" class="nav-btn filled" id="btn-nuevo" style="display:none;">+ Nuevo análisis</a>
  </div>

  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Buscar análisis...">
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="general">General</button>
    <button class="filter-btn" data-filter="NBA">NBA</button>
    <button class="filter-btn" data-filter="ACB">ACB</button>
    <button class="filter-btn" data-filter="EuroLeague">EuroLeague</button>
  </div>

  <div class="loading" id="loading"><div class="spinner"></div>Cargando análisis...</div>
  <div class="posts" id="posts"></div>
  <div class="empty" id="empty" style="display:none;">Todavía no hay análisis publicados. ¡Sé el primero!</div>
</div>

<!-- Modal post completo -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mnccorcmggxncjkcsxwq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uY2NvcmNtZ2d4bmNqa2NzeHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NjUyOTEsImV4cCI6MjA5NzA0MTI5MX0.kndtQGiTO_Z3Ob0Rha0AVpUjHjKgDxGmE9GRRgAmiAM';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentFilter = 'all';
let searchQuery = '';
let allPosts = [];

// ── Rangos ────────────────────────────────────────────────────────────────────
function getBadges(profile, avgRating) {
  const badges = [];
  if (profile.role === 'creator') badges.push('<span title="Creador" style="color:#9b59b6;">★</span>');
  if (profile.role === 'coach' || profile.coach_title) badges.push('<span title="Entrenador verificado" style="color:#1a7a4a;">★</span>');
  if (avgRating >= 4) badges.push('<span title="Valoración excelente" style="color:#f5a623;">★</span>');
  else if (avgRating >= 3) badges.push('<span title="Buena valoración" style="color:#aaa;">★</span>');
  else badges.push('<span title="Sin valoraciones destacadas" style="color:#ddd;">★</span>');
  return badges.join('');
}

// ── Auth ─────────────────────────────────────────────────────────────────────
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session?.user || null;
  renderAuthArea();
  loadPosts();
}

function renderAuthArea() {
  const area = document.getElementById('auth-area');
  if (currentUser) {
    document.getElementById('btn-nuevo').style.display = 'inline-flex';
    area.innerHTML = `
      <a href="perfil.html" class="nav-btn">Mi perfil</a>
      <button class="nav-btn" id="btn-logout">Salir</button>
    `;
    document.getElementById('btn-logout').onclick = async () => {
      await sb.auth.signOut(); location.reload();
    };
  } else {
    area.innerHTML = `<a href="registro.html" class="nav-btn filled">Entrar</a>`;
  }
}

// ── Posts ─────────────────────────────────────────────────────────────────────
let myRatedPosts = {}; // post_id -> stars que ya puso este usuario (solo para bloquear el botón, nunca se muestra a otros)

async function loadPosts() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('posts').innerHTML = '';

  const { data, error } = await sb
    .from('posts')
    .select('*, profiles(username, full_name, avatar_url, role, coach_title, coach_federation)')
    .order('created_at', { ascending: false });

  document.getElementById('loading').style.display = 'none';

  if (error || !data || !data.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  // Cargar ratings para cada post (sin user_id en el resultado público: solo se usa para la media)
  const postIds = data.map(p => p.id);
  const { data: ratings } = await sb.from('ratings').select('post_id, stars');

  const ratingMap = {};
  if (ratings) {
    ratings.forEach(r => {
      if (!ratingMap[r.post_id]) ratingMap[r.post_id] = [];
      ratingMap[r.post_id].push(r.stars);
    });
  }

  // Si hay sesión, comprobar qué posts ya valoró este usuario (consulta privada,
  // solo le sirve a su propio navegador para desactivar el botón de votar otra vez)
  myRatedPosts = {};
  if (currentUser) {
    const { data: mine } = await sb.from('ratings').select('post_id, stars').eq('user_id', currentUser.id);
    if (mine) mine.forEach(r => { myRatedPosts[r.post_id] = r.stars; });
  }

  allPosts = data.map(p => ({
    ...p,
    ratings: ratingMap[p.id] || [],
    avgRating: ratingMap[p.id]?.length
      ? ratingMap[p.id].reduce((a,b)=>a+b,0) / ratingMap[p.id].length
      : 0
  }));

  renderPosts();

  // Si venimos desde el perfil con ?post=ID, abrir ese post automáticamente
  const urlPostId = new URLSearchParams(window.location.search).get('post');
  if (urlPostId) openPost(urlPostId);
}

function renderPosts() {
  const container = document.getElementById('posts');
  const filtered = allPosts.filter(p => {
    const matchFilter = currentFilter === 'all' || p.league === currentFilter;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q || p.title?.toLowerCase().includes(q) || p.content?.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  if (!filtered.length) {
    document.getElementById('empty').style.display = 'block';
    container.innerHTML = '';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  container.innerHTML = filtered.map(p => {
    const profile = p.profiles || {};
    const name = profile.username || 'Usuario';
    const initials = name.slice(0,2).toUpperCase();
    const avatarHtml = profile.avatar_url
      ? `<img src="${profile.avatar_url}" alt="${name}">`
      : initials;
    const badges = getBadges(profile, p.avgRating);
    const avgStr = p.ratings.length ? p.avgRating.toFixed(1) : '—';
    const countStr = p.ratings.length ? `(${p.ratings.length})` : '(0 valoraciones)';
    const myStars = myRatedPosts[p.id]; // si existe, ya votó este post

    return `
    <div class="post-card" id="post-${p.id}">
      <div class="post-header">
        <a href="perfil.html?id=${p.user_id}" class="avatar">${avatarHtml}</a>
        <div class="post-meta">
          <a href="perfil.html?id=${p.user_id}" class="post-author">
            ${name} <span class="stars-badge">${badges}</span>
          </a>
          <div class="post-date">${new Date(p.created_at).toLocaleDateString('es-ES', {day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
      </div>

      <div class="post-tags">
        ${p.league ? `<span class="tag league">${p.league}</span>` : ''}
        ${p.team ? `<span class="tag team">${p.team}</span>` : ''}
      </div>

      <div class="post-title">${p.title || 'Sin título'}</div>
      <div class="post-content">${p.content || ''}</div>

      <div class="post-media">
        ${p.video_url ? `<div class="media-badge">🎥 Vídeo incluido</div>` : ''}
        ${p.court_data ? `<div class="media-badge">✏️ Pizarra incluida</div>` : ''}
      </div>

      <div class="post-footer">
        <div class="rating-area">
          <div class="rating-stars" data-post="${p.id}" ${myStars ? 'data-locked="true"' : ''}>
            ${[1,2,3,4,5].map(s => `<button class="rating-star ${myStars && s <= myStars ? 'selected' : ''}" data-star="${s}" aria-label="${s} estrellas" ${myStars ? 'style="pointer-events:none;"' : ''}>★</button>`).join('')}
          </div>
          <span class="rating-avg">${avgStr}</span>
          <span class="rating-count">${countStr}</span>
          ${myStars ? '<span style="font-size:11px;color:#aaa;">· ya valorado</span>' : ''}
        </div>
        <button class="read-more" onclick="openPost('${p.id}')">Leer más →</button>
      </div>
    </div>`;
  }).join('');

  // Eventos de valoración
  document.querySelectorAll('.rating-stars').forEach(area => {
    if (area.dataset.locked === 'true') return; // ya votado, no permitir más clics
    const postId = area.dataset.post;
    const stars = area.querySelectorAll('.rating-star');
    stars.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        const n = parseInt(btn.dataset.star);
        stars.forEach((s,i) => s.classList.toggle('hover', i < n));
      });
      btn.addEventListener('mouseleave', () => stars.forEach(s => s.classList.remove('hover')));
      btn.addEventListener('click', () => submitRating(postId, parseInt(btn.dataset.star), stars));
    });
  });
}

async function submitRating(postId, stars, starBtns) {
  if (!currentUser) {
    if (confirm('Tienes que iniciar sesión para valorar un análisis. ¿Quieres ir a la página de inicio de sesión?')) {
      window.location.href = 'registro.html';
    }
    return;
  }
  if (myRatedPosts[postId] !== undefined) return; // ya votado, protección extra en cliente

  const { error } = await sb.from('ratings').insert([{ post_id: postId, stars, user_id: currentUser.id }]);
  if (!error) {
    myRatedPosts[postId] = stars;
    starBtns.forEach((s,i) => { s.classList.toggle('selected', i < stars); s.style.pointerEvents = 'none'; });
    const post = allPosts.find(p => p.id === postId);
    if (post) { post.ratings.push(stars); post.avgRating = post.ratings.reduce((a,b)=>a+b,0)/post.ratings.length; }
    const avgEl = starBtns[0].closest('.rating-area').querySelector('.rating-avg');
    const cntEl = starBtns[0].closest('.rating-area').querySelector('.rating-count');
    if (avgEl && post) avgEl.textContent = post.avgRating.toFixed(1);
    if (cntEl && post) cntEl.textContent = `(${post.ratings.length})`;
  } else {
    // Si la base de datos rechaza por duplicado (protección real del servidor)
    alert('Ya has valorado este análisis anteriormente.');
  }
}

// ── Modal post completo ───────────────────────────────────────────────────────
async function openPost(postId) {
  const post = allPosts.find(p => p.id === postId);
  if (!post) return;
  const profile = post.profiles || {};

  let videoEmbed = '';
  if (post.video_url) {
    const ytMatch = post.video_url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
    const vimeoMatch = post.video_url.match(/vimeo\.com\/(\d+)/);
    if (ytMatch) videoEmbed = `<iframe class="modal-video" src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>`;
    else if (vimeoMatch) videoEmbed = `<iframe class="modal-video" src="https://player.vimeo.com/video/${vimeoMatch[1]}" allowfullscreen></iframe>`;
    else videoEmbed = `<a href="${post.video_url}" target="_blank" style="color:#1a7a4a;">Ver vídeo →</a>`;
  }

  let courtHtml = '';
  if (post.court_data) {
    courtHtml = `<img src="${post.court_data}" class="modal-court" alt="Pizarra táctica">`;
  }

  document.getElementById('modal-content').innerHTML = `
    <div class="post-tags" style="margin-bottom:12px;">
      ${post.league ? `<span class="tag league">${post.league}</span>` : ''}
      ${post.team ? `<span class="tag team">${post.team}</span>` : ''}
    </div>
    <div class="modal-title">${post.title || 'Sin título'}</div>
    <div style="font-size:13px;color:#aaa;margin-bottom:20px;">
      Por ${profile.username || 'Usuario'} · ${new Date(post.created_at).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
    </div>
    <div class="modal-content">${(post.content || '').replace(/\n/g,'<br>')}</div>
    ${videoEmbed}
    ${courtHtml}
  `;
  document.getElementById('modal').classList.add('open');
}

document.getElementById('modal-close').onclick = () => document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click', e => { if(e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); });

// ── Filtros y búsqueda ────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPosts();
  });
});
document.getElementById('search').addEventListener('input', e => { searchQuery = e.target.value; renderPosts(); });

initAuth();
</script>
</body>
</html>
