<script>
const SUPABASE_URL = 'https://mnccorcmggxncjkcsxwq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uY2NvcmNtZ2d4bmNqa2NzeHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NjUyOTEsImV4cCI6MjA5NzA0MTI5MX0.kndtQGiTO_Z3Ob0Rha0AVpUjHjKgDxGmE9GRRgAmiAM';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── Auth check ────────────────────────────────────────────────────────────────
sb.auth.getSession().then(({ data: { session } }) => {
  if (!session) window.location.href = 'registro.html';
});

// ── Tags ──────────────────────────────────────────────────────────────────────
function updateTeamVisibility() {
  const league = document.getElementById('league').value;
  document.getElementById('team-field').style.display = league === 'general' ? 'none' : 'block';
}

// ── Pizarra ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('mini-court');
const ctx = canvas.getContext('2d');
const CW = 700, CH = 375;
let courtTool = 'select', courtColor = '#000000', courtSize = 3;
let courtDrawing = false, courtArrowStart = null, courtArrowPreview = null;
let courtPlayers = [], courtStrokes = [], courtCurrentStroke = null;
let courtDragging = null, courtDragOffset = {x:0,y:0};
let courtActive = false;

function toggleCourt() {
  courtActive = !courtActive;
  document.getElementById('court-toggle').classList.toggle('on', courtActive);
  document.getElementById('court-section').style.display = courtActive ? 'block' : 'none';
  if (courtActive) renderCourt();
}

function setCourtTool(t) {
  courtTool = t;
  document.querySelectorAll('.ct-btn[id^="ct-"]').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('ct-' + t);
  if (el) el.classList.add('active');
}

function setCourtColor(el) {
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('sel'));
  el.classList.add('sel');
  courtColor = el.dataset.color;
}

function addCourtPlayer(team) {
  const side = team === 'local';
  const cnt = courtPlayers.filter(p=>p.team===team).length + 1;
  if (cnt > 5) return;
  courtPlayers.push({ x: side ? 120 + Math.random()*80 : 480 + Math.random()*80, y: 40 + Math.random()*260, team, num: cnt });
  renderCourt();
}

function clearCourt() { courtPlayers = []; courtStrokes = []; renderCourt(); }

function drawParquet(ctx, w, h) {
  ctx.fillStyle = '#C8A45A';
  ctx.fillRect(0, 0, w, h);
  const bandH = Math.round(h / 20);
  for (let i = 0; i < 21; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,220,130,0.18)' : 'rgba(120,70,10,0.10)';
    ctx.fillRect(0, i * bandH, w, bandH);
  }
  const pw = Math.round(w / 30);
  ctx.strokeStyle = 'rgba(100,60,10,0.18)'; ctx.lineWidth = 0.7;
  for (let x = 0; x <= w; x += pw) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y <= h; y += bandH) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(160,100,20,0.07)'; ctx.lineWidth = 0.4;
  for (let y = 0; y <= h; y += Math.round(bandH/4)) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}

// ── Geometría FIBA real (idéntica a pizarra-tactica.html) ──────────────────────
function buildScale(w, h) {
  const courtW = 28, courtH = 15, pad = 0.5;
  const totalW = courtW + 2*pad, totalH = courtH + 2*pad;
  const scale = Math.min(w/totalW, h/totalH);
  const offsetX = (w - courtW*scale)/2, offsetY = (h - courtH*scale)/2;
  function m(mx,my){ return { x: offsetX+mx*scale, y: offsetY+my*scale }; }
  return { scale, m, courtW, courtH };
}

function drawBasketEnd(ctx, scale, m, side, courtH, LC, LW) {
  const basketFromBaseline = 1.575, keyWidth = 4.9, keyDepth = 5.8;
  const ftRadius = 1.8, tripleR = 6.75, cornerY = 0.9, restrictedR = 1.25;
  const bxM = side === 'left' ? basketFromBaseline : 28 - basketFromBaseline;
  const byM = courtH/2;
  const basket = m(bxM, byM);
  const keyTop = byM - keyWidth/2, keyBottom = byM + keyWidth/2;
  const bx = side === 'left' ? 0 : 28;

  ctx.strokeStyle = LC; ctx.fillStyle = LC; ctx.lineWidth = LW; ctx.lineCap='round'; ctx.lineJoin='round';

  if (side === 'left') {
    ctx.strokeRect(m(0,keyTop).x, m(0,keyTop).y, m(keyDepth,0).x-m(0,0).x, keyWidth*scale);
  } else {
    ctx.strokeRect(m(28-keyDepth,keyTop).x, m(0,keyTop).y, m(keyDepth,0).x-m(0,0).x, keyWidth*scale);
  }

  const ftCentre = side==='left' ? m(keyDepth,byM) : m(28-keyDepth,byM);
  ctx.beginPath();
  if (side==='left') ctx.arc(ftCentre.x,ftCentre.y,ftRadius*scale,Math.PI/2,-Math.PI/2,true);
  else ctx.arc(ftCentre.x,ftCentre.y,ftRadius*scale,-Math.PI/2,Math.PI/2,true);
  ctx.stroke();
  ctx.setLineDash([8,7]);
  ctx.beginPath();
  if (side==='left') ctx.arc(ftCentre.x,ftCentre.y,ftRadius*scale,-Math.PI/2,Math.PI/2,true);
  else ctx.arc(ftCentre.x,ftCentre.y,ftRadius*scale,Math.PI/2,-Math.PI/2,true);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  if (side==='left') ctx.arc(basket.x,basket.y,restrictedR*scale,Math.PI/2,-Math.PI/2,true);
  else ctx.arc(basket.x,basket.y,restrictedR*scale,-Math.PI/2,Math.PI/2,true);
  ctx.stroke();

  const dx3 = Math.sqrt(tripleR*tripleR - (byM-cornerY)*(byM-cornerY));
  if (side === 'left') {
    const arcMeetX = bxM + dx3;
    ctx.beginPath(); ctx.moveTo(m(0,cornerY).x,m(0,cornerY).y); ctx.lineTo(m(arcMeetX,cornerY).x,m(0,cornerY).y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m(0,courtH-cornerY).x,m(0,courtH-cornerY).y); ctx.lineTo(m(arcMeetX,courtH-cornerY).x,m(0,courtH-cornerY).y); ctx.stroke();
    const angTop = Math.atan2(cornerY-byM, arcMeetX-bxM), angBot = Math.atan2((courtH-cornerY)-byM, arcMeetX-bxM);
    ctx.beginPath(); ctx.arc(basket.x,basket.y,tripleR*scale,angTop,angBot,false); ctx.stroke();
  } else {
    const bxMr = 28 - basketFromBaseline;
    const arcMeetX = bxMr - dx3;
    ctx.beginPath(); ctx.moveTo(m(28,cornerY).x,m(0,cornerY).y); ctx.lineTo(m(arcMeetX,cornerY).x,m(0,cornerY).y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m(28,courtH-cornerY).x,m(0,courtH-cornerY).y); ctx.lineTo(m(arcMeetX,courtH-cornerY).x,m(0,courtH-cornerY).y); ctx.stroke();
    const angTop = Math.atan2(cornerY-byM, arcMeetX-bxMr), angBot = Math.atan2((courtH-cornerY)-byM, arcMeetX-bxMr);
    ctx.beginPath(); ctx.arc(basket.x,basket.y,tripleR*scale,angTop,angBot,true); ctx.stroke();
  }

  const bbXm = side==='left' ? 1.2 : 28-1.2, bbHalf = 0.9;
  ctx.lineWidth = LW*2;
  ctx.beginPath(); ctx.moveTo(m(bbXm,byM-bbHalf).x,m(0,byM-bbHalf).y); ctx.lineTo(m(bbXm,byM+bbHalf).x,m(0,byM+bbHalf).y); ctx.stroke();
  ctx.lineWidth = LW;

  ctx.beginPath(); ctx.arc(basket.x,basket.y,0.225*scale,0,Math.PI*2);
  ctx.strokeStyle='#cc2200'; ctx.lineWidth=LW*1.5; ctx.stroke();
  ctx.strokeStyle=LC; ctx.lineWidth=LW;

  const markLen = 0.2*scale;
  [keyDepth-1.75, keyDepth-3.0].forEach(mxm => {
    const mx = side==='left' ? mxm : 28-mxm;
    ctx.beginPath(); ctx.moveTo(m(mx,keyTop).x,m(0,keyTop).y); ctx.lineTo(m(mx,keyTop).x,m(0,keyTop).y-markLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m(mx,keyBottom).x,m(0,keyBottom).y); ctx.lineTo(m(mx,keyBottom).x,m(0,keyBottom).y+markLen); ctx.stroke();
  });
}

function renderCourt() {
  ctx.clearRect(0,0,CW,CH);
  drawParquet(ctx,CW,CH);
  drawCourtLines();
  courtStrokes.forEach(s => drawCourtStroke(ctx,s));
  if (courtArrowPreview) {
    ctx.setLineDash([6,4]); ctx.strokeStyle=courtArrowPreview.color; ctx.lineWidth=courtArrowPreview.size; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(courtArrowPreview.x1,courtArrowPreview.y1); ctx.lineTo(courtArrowPreview.x2,courtArrowPreview.y2); ctx.stroke();
    ctx.setLineDash([]);
    drawCourtArrow(courtArrowPreview.x1,courtArrowPreview.y1,courtArrowPreview.x2,courtArrowPreview.y2,courtArrowPreview.color,courtArrowPreview.size);
  }
  courtPlayers.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x,p.y,14,0,Math.PI*2);
    ctx.fillStyle=p.team==='local'?'#D85A30':'#185FA5'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.num,p.x,p.y);
  });
}

function drawCourtLines() {
  const {scale, m, courtW, courtH} = buildScale(CW, CH);
  const LC = '#1a1a1a', LW = Math.max(1.5, scale*0.05);
  ctx.strokeStyle=LC; ctx.fillStyle=LC; ctx.lineWidth=LW; ctx.lineCap='round'; ctx.lineJoin='round';

  const tl = m(0,0), br = m(courtW,courtH);
  ctx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);

  const cl1=m(courtW/2,0), cl2=m(courtW/2,courtH);
  ctx.beginPath(); ctx.moveTo(cl1.x,cl1.y); ctx.lineTo(cl2.x,cl2.y); ctx.stroke();

  const centre = m(courtW/2,courtH/2);
  ctx.beginPath(); ctx.arc(centre.x,centre.y,1.8*scale,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(centre.x,centre.y,0.15*scale,0,Math.PI*2); ctx.fill();

  drawBasketEnd(ctx, scale, m, 'left', courtH, LC, LW);
  drawBasketEnd(ctx, scale, m, 'right', courtH, LC, LW);
  return;
}

function drawCourtStroke(ctx, s) {
  if(s.type==='free'){
    ctx.strokeStyle=s.color; ctx.lineWidth=s.size; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); s.pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
  } else if(s.type==='arrow'){
    ctx.strokeStyle=s.color; ctx.lineWidth=s.size; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    drawCourtArrow(s.x1,s.y1,s.x2,s.y2,s.color,s.size);
  }
}

function drawCourtArrow(x1,y1,x2,y2,color,size) {
  const a=Math.atan2(y2-y1,x2-x1), l=10+size*1.4;
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x2,y2); ctx.lineTo(x2-l*Math.cos(a-0.38),y2-l*Math.sin(a-0.38));
  ctx.lineTo(x2-l*Math.cos(a+0.38),y2-l*Math.sin(a+0.38)); ctx.closePath(); ctx.fill();
}

function getCourtPos(e) {
  const r=canvas.getBoundingClientRect();
  const ex=e.touches?e.touches[0].clientX:e.clientX;
  const ey=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(ex-r.left)*(CW/r.width),y:(ey-r.top)*(CH/r.height)};
}
function playerAt(x,y){for(let i=courtPlayers.length-1;i>=0;i--){const dx=courtPlayers[i].x-x,dy=courtPlayers[i].y-y;if(Math.sqrt(dx*dx+dy*dy)<16)return i;}return -1;}

canvas.addEventListener('mousedown',e=>{
  const {x,y}=getCourtPos(e);
  if(courtTool==='select'){const i=playerAt(x,y);if(i>=0){courtDragging=i;courtDragOffset={x:courtPlayers[i].x-x,y:courtPlayers[i].y-y};}}
  else if(courtTool==='draw'){courtDrawing=true;courtCurrentStroke={type:'free',color:courtColor,size:courtSize,pts:[{x,y}]};}
  else if(courtTool==='erase'){courtDrawing=true;eraseNear(x,y);}
  else if(courtTool==='arrow'){courtDrawing=true;courtArrowStart={x,y};courtArrowPreview={color:courtColor,size:courtSize,x1:x,y1:y,x2:x,y2:y};}
});
canvas.addEventListener('mousemove',e=>{
  const {x,y}=getCourtPos(e);
  if(courtTool==='select'&&courtDragging!==null){courtPlayers[courtDragging].x=x+courtDragOffset.x;courtPlayers[courtDragging].y=y+courtDragOffset.y;renderCourt();}
  else if(courtTool==='draw'&&courtDrawing&&courtCurrentStroke){courtCurrentStroke.pts.push({x,y});renderCourt();}
  else if(courtTool==='erase'&&courtDrawing){eraseNear(x,y);}
  else if(courtTool==='arrow'&&courtDrawing&&courtArrowStart){courtArrowPreview={color:courtColor,size:courtSize,x1:courtArrowStart.x,y1:courtArrowStart.y,x2:x,y2:y};renderCourt();}
});
canvas.addEventListener('mouseup',e=>{
  if(courtTool==='select'){courtDragging=null;}
  else if(courtTool==='draw'&&courtDrawing&&courtCurrentStroke){courtStrokes.push(courtCurrentStroke);courtCurrentStroke=null;courtDrawing=false;renderCourt();}
  else if(courtTool==='erase'){courtDrawing=false;}
  else if(courtTool==='arrow'&&courtDrawing&&courtArrowStart){
    const {x,y}=getCourtPos(e);
    courtStrokes.push({type:'arrow',color:courtColor,size:courtSize,x1:courtArrowStart.x,y1:courtArrowStart.y,x2:x,y2:y});
    courtArrowPreview=null;courtArrowStart=null;courtDrawing=false;renderCourt();
  }
});
canvas.addEventListener('mouseleave',()=>{courtDragging=null;});

// Borrador real: elimina del array cualquier trazo que pase cerca del cursor,
// en vez de pintar por encima (lo cual se notaría sobre el parquet de madera).
function eraseNear(x, y) {
  const radius = courtSize * 5 + 6;
  const before = courtStrokes.length;
  courtStrokes = courtStrokes.filter(s => !strokeNearPoint(s, x, y, radius));
  if (courtStrokes.length !== before) renderCourt();
}

function strokeNearPoint(s, x, y, radius) {
  if (s.type === 'free') {
    return s.pts.some(p => Math.hypot(p.x - x, p.y - y) < radius);
  }
  if (s.type === 'arrow' || s.type === 'line') {
    return distToSegment(x, y, s.x1, s.y1, s.x2, s.y2) < radius;
  }
  return false;
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq === 0 ? 0 : ((px-x1)*dx + (py-y1)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px-cx, py-cy);
}

// ── Submit ────────────────────────────────────────────────────────────────────
async function submitPost() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'registro.html'; return; }

  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();
  const errEl = document.getElementById('post-error');
  errEl.style.display = 'none';

  if (!title || !content) {
    errEl.textContent = 'El título y el contenido son obligatorios.';
    errEl.style.display = 'block'; return;
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Publicando...';

  let courtData = null;
  if (courtActive) courtData = canvas.toDataURL('image/png');

  const { error } = await sb.from('posts').insert([{
    user_id: session.user.id,
    title,
    content,
    video_url: document.getElementById('video_url').value.trim() || null,
    court_data: courtData,
    league: document.getElementById('league').value,
    team: document.getElementById('team').value.trim() || null,
  }]);

  if (error) {
    errEl.textContent = 'Error al publicar: ' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Publicar análisis';
  } else {
    window.location.href = 'comunidad.html';
  }
}
