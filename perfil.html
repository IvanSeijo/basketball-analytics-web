<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil de Usuario - Basketball Analytics</title>
<meta name="description" content="Perfil de usuario en Basketball Analytics: análisis publicados, valoraciones y credenciales verificadas.">
<meta name="keywords" content="perfil basketball analytics">
<meta name="author" content="Iván Seijo">
<link rel="canonical" href="https://ivanseijo.github.io/basketball-analytics-web/perfil.html">

<!-- Open Graph / redes sociales -->
<meta property="og:title" content="Perfil de Usuario - Basketball Analytics">
<meta property="og:description" content="Perfil de usuario en Basketball Analytics: análisis publicados, valoraciones y credenciales verificadas.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ivanseijo.github.io/basketball-analytics-web/perfil.html">
<meta property="og:site_name" content="Basketball Analytics">
<meta property="og:locale" content="es_ES">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Perfil de Usuario - Basketball Analytics">
<meta name="twitter:description" content="Perfil de usuario en Basketball Analytics: análisis publicados, valoraciones y credenciales verificadas.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f4f4; color: #1a1a1a; }
  .header {
    background: #fff; border-bottom: 1px solid #e8e8e8;
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 10px;
  }
  .logo { font-size: 20px; font-weight: 700; text-decoration: none; color: #1a1a1a; }
  .logo .b { color: #1a7a4a; }
  .nav a { padding: 7px 14px; font-size: 13px; border: 1px solid #e0e0e0; border-radius: 8px; text-decoration: none; color: #555; margin-left: 6px; }
  .nav a:hover { background: #f5f5f5; }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }

  .profile-card {
    background: #fff; border: 1px solid #e8e8e8; border-radius: 16px;
    padding: 32px; display: flex; gap: 24px; align-items: flex-start;
    flex-wrap: wrap; margin-bottom: 24px;
  }
  .avatar-big {
    width: 88px; height: 88px; border-radius: 50%; background: #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; color: #555; flex-shrink: 0;
    overflow: hidden; position: relative; cursor: pointer;
  }
  .avatar-big img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-big .edit-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; opacity: 0; transition: opacity 0.2s;
  }
  .avatar-big:hover .edit-overlay { opacity: 1; }
  input#avatar-input { display: none; }

  .profile-info { flex: 1; min-width: 200px; }
  .profile-name { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .profile-username { font-size: 14px; color: #888; margin-top: 4px; }
  .profile-badges { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .badge-item {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 500;
    display: flex; align-items: center; gap: 4px;
  }
  .badge-creator { background: #f3e8ff; color: #7c3aed; }
  .badge-coach { background: #e8fdf0; color: #1a7a4a; }
  .badge-gold { background: #fef9e7; color: #b7860b; }
  .badge-silver { background: #f5f5f5; color: #888; }

  .coach-info { font-size: 13px; color: #666; margin-top: 8px; }
  .profile-stats { display: flex; gap: 24px; margin-top: 16px; }
  .pstat { text-align: center; }
  .pstat .num { font-size: 20px; font-weight: 700; }
  .pstat .lbl { font-size: 12px; color: #aaa; }

  /* Edit form */
  .edit-section {
    background: #fff; border: 1px solid #e8e8e8; border-radius: 12px;
    padding: 24px; margin-bottom: 16px; display: none;
  }
  .edit-section.visible { display: block; }
  .edit-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 8px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: #1a7a4a; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn { padding: 9px 20px; font-size: 13px; font-family: inherit; border-radius: 8px; cursor: pointer; font-weight: 500; }
  .btn-primary { background: #1a1a1a; color: #fff; border: none; }
  .btn-primary:hover { background: #333; }
  .btn-secondary { background: #fff; color: #555; border: 1px solid #ddd; }
  .btn-secondary:hover { background: #f5f5f5; }
  .btn-danger { background: #fff; color: #c0392b; border: 1px solid #f09595; }
  .btn-danger:hover { background: #fff0f0; }

  .posts-section h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .post-mini {
    background: #fff; border: 1px solid #e8e8e8; border-radius: 10px;
    padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    cursor: pointer; transition: box-shadow 0.15s;
  }
  .post-mini:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.07); }
  .post-mini h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .post-mini p { font-size: 13px; color: #888; }
  .post-mini-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f0f0f0; color: #666; }
  .tag.league { background: #e8fdf0; color: #1a7a4a; }

  .empty { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }

  @media (max-width: 600px) {
    .header, .page { padding-left: 16px; padding-right: 16px; }
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="header">
  <a href="index.html" class="logo"><span class="b">B</span>A Basketball Analytics</a>
  <nav class="nav">
    <a href="comunidad.html">← Comunidad</a>
  </nav>
</header>

<div class="page">
  <div id="loading" style="text-align:center;padding:60px;color:#aaa;">Cargando perfil...</div>
  <div id="profile-content" style="display:none;"></div>
</div>

<script>
const SUPABASE_URL = 'https://mnccorcmggxncjkcsxwq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uY2NvcmNtZ2d4bmNqa2NzeHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NjUyOTEsImV4cCI6MjA5NzA0MTI5MX0.kndtQGiTO_Z3Ob0Rha0AVpUjHjKgDxGmE9GRRgAmiAM';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const profileId = params.get('id');
let currentUser = null;
let profileData = null;
let isOwnProfile = false;

function getBadges(profile, avgRating, count) {
  const badges = [];
  if (profile.role === 'creator') badges.push({cls:'badge-creator', icon:'★', text:'Creador'});
  if (profile.role === 'coach' || profile.coach_title) {
    const coachText = profile.coach_title ? `Entrenador · ${profile.coach_title}${profile.coach_federation ? ' (' + profile.coach_federation + ')' : ''}` : 'Entrenador verificado';
    badges.push({cls:'badge-coach', icon:'★', text: coachText});
  }
  if (count >= 10 && avgRating >= 4) badges.push({cls:'badge-gold', icon:'★', text:'Analista destacado'});
  else if (count >= 5 && avgRating >= 3) badges.push({cls:'badge-silver', icon:'★', text:'Buen analista'});
  return badges.map(b => `<span class="badge-item ${b.cls}">${b.icon} ${b.text}</span>`).join('');
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session?.user || null;
  const targetId = profileId || currentUser?.id;
  if (!targetId) { window.location.href = 'registro.html'; return; }
  isOwnProfile = currentUser?.id === targetId;

  const { data: profile } = await sb.from('profiles').select('*').eq('id', targetId).single();
  if (!profile) { document.getElementById('loading').textContent = 'Perfil no encontrado.'; return; }
  profileData = profile;

  const { data: posts } = await sb.from('posts').select('*').eq('user_id', targetId).order('created_at', {ascending: false});
  const { data: ratings } = await sb.from('ratings').select('post_id, stars');

  const postIds = (posts||[]).map(p=>p.id);
  const ratingMap = {};
  (ratings||[]).forEach(r => { if(postIds.includes(r.post_id)){if(!ratingMap[r.post_id])ratingMap[r.post_id]=[];ratingMap[r.post_id].push(r.stars);} });

  let totalStars = 0, totalCount = 0;
  (posts||[]).forEach(p => { const rs = ratingMap[p.id]||[]; totalStars+=rs.reduce((a,b)=>a+b,0); totalCount+=rs.length; });
  const avgRating = totalCount ? totalStars/totalCount : 0;
  const initials = (profile.username||'U').slice(0,2).toUpperCase();
  const avatarHtml = profile.avatar_url ? `<img src="${profile.avatar_url}" alt="${profile.username}">` : initials;
  const badges = getBadges(profile, avgRating, totalCount);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('profile-content').style.display = 'block';
  document.getElementById('profile-content').innerHTML = `
    <div class="profile-card">
      <div class="avatar-big" id="avatar-wrap" ${isOwnProfile?'onclick="document.getElementById(\'avatar-input\').click()"':''}>
        ${avatarHtml}
        ${isOwnProfile?'<div class="edit-overlay">📷</div>':''}
      </div>
      <input type="file" id="avatar-input" accept="image/*" onchange="uploadAvatar(this)">

      <div class="profile-info">
        <div class="profile-name">
          ${profile.full_name || profile.username}
        </div>
        <div class="profile-username">@${profile.username}</div>
        <div class="profile-badges" style="margin-top:10px;">${badges}</div>
        <div class="profile-stats" style="margin-top:16px;">
          <div class="pstat"><div class="num">${(posts||[]).length}</div><div class="lbl">Análisis</div></div>
          <div class="pstat"><div class="num">${totalCount}</div><div class="lbl">Valoraciones</div></div>
          <div class="pstat"><div class="num">${totalCount?avgRating.toFixed(1):'—'}</div><div class="lbl">Media ★</div></div>
        </div>
      </div>

      ${isOwnProfile ? `
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;">
        <button class="btn btn-secondary" onclick="toggleEdit()">Editar perfil</button>
        <button class="btn btn-danger" onclick="logout()">Salir</button>
      </div>` : ''}
    </div>

    ${isOwnProfile ? `
    <div class="edit-section" id="edit-section">
      <h2>Editar perfil</h2>
      <div class="field"><label>Nombre de usuario</label><input id="e-username" value="${profile.username||''}"></div>
      <div class="field"><label>Nombre real</label><input id="e-fullname" value="${profile.full_name||''}"></div>
      <div class="field-row">
        <div class="field">
          <label>Título de entrenador (si tienes)</label>
          <input id="e-coach-title" value="${profile.coach_title||''}" placeholder="ej: Nivel 3 FEB">
        </div>
        <div class="field">
          <label>Federación</label>
          <input id="e-coach-fed" value="${profile.coach_federation||''}" placeholder="ej: FEB, FIBA, ACB...">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-primary" onclick="saveProfile()">Guardar</button>
        <button class="btn btn-secondary" onclick="toggleEdit()">Cancelar</button>
      </div>
    </div>` : ''}

    <div class="posts-section">
      <h2>Análisis publicados</h2>
      ${(posts||[]).length === 0
        ? '<div class="empty">Todavía no hay análisis publicados.</div>'
        : (posts||[]).map(p => `
          <div class="post-mini" onclick="goToPost(event, '${p.id}')">
            <div>
              <div style="display:flex;gap:6px;margin-bottom:6px;">
                ${p.league?`<span class="tag league">${p.league}</span>`:''}
                ${p.team?`<span class="tag">${p.team}</span>`:''}
              </div>
              <h4>${p.title||'Sin título'}</h4>
              <p>${new Date(p.created_at).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})} · ${(ratingMap[p.id]||[]).length} valoraciones</p>
            </div>
            ${isOwnProfile?`<div class="post-mini-actions"><button class="btn btn-danger" onclick="event.stopPropagation(); deletePost('${p.id}')">Eliminar</button></div>`:''}
          </div>`).join('')}
    </div>
  `;
}

function toggleEdit() {
  document.getElementById('edit-section').classList.toggle('visible');
}

async function saveProfile() {
  const updates = {
    username: document.getElementById('e-username').value.trim(),
    full_name: document.getElementById('e-fullname').value.trim(),
    coach_title: document.getElementById('e-coach-title').value.trim() || null,
    coach_federation: document.getElementById('e-coach-fed').value.trim() || null,
  };
  if (updates.coach_title) updates.role = 'coach';
  await sb.from('profiles').update(updates).eq('id', currentUser.id);
  location.reload();
}

async function uploadAvatar(input) {
  const file = input.files[0]; if (!file) return;
  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}.${ext}`;
  const { error } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (!error) {
    const { data } = sb.storage.from('avatars').getPublicUrl(path);
    await sb.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', currentUser.id);
    location.reload();
  }
}

function goToPost(event, postId) {
  event.stopPropagation();
  window.location.href = `comunidad.html?post=${postId}`;
}

async function deletePost(postId) {
  if (!confirm('¿Eliminar este análisis?')) return;
  await sb.from('posts').delete().eq('id', postId);
  location.reload();
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'comunidad.html';
}

init();
</script>
</body>
</html>
